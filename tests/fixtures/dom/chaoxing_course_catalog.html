<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>sanitized-fixture</title>
<!--
  脱敏目录 fixture —— 从真实 mooc2 课程页（docs/evidence/mooc2_evidence/page.html）
  的 DOM 标记抽取并播放/得分处理，去掉真实会话/时间戳/个人数据。
  结构与真实一致的目录树片段，供 TDVP/state DOM 解析回归（P0-03）消费：
    - #coursetree > ul > li(章)  >  .posCatalog_select(:not(.firstLayer))（小节）
    - .posCatalog_name 标题；.posCatalog_finish/.icon_Completed 完成标记
    - /已完成|Completed/ 文本 · a[href*="chapterId"] · onclick=...chapterId...
  课程/章节 id 均为有限 sampling 的占位整数，不代表任何真实课程。
-->
</head>
<body>
<div id="coursetree" class="coursetree">
  <ul>
    <!-- 章 1：已完成的章（目录顶格） -->
    <li class="chapter firstLayer">
      <div class="posCatalog_first">
        <div class="posCatalog_select firstLayer">
          <a href="javascript:void(0)" class="posCatalog_unit">第一章 概述</a>
        </div>
      </div>
      <ul>
        <li>
          <div class="posCatalog_select" onclick="javascript:void(0)" data-knowledgeid="6100112">
            <div class="num_tune"><a>1.1</a></div>
            <div class="posCatalog_name">1.1 绪论</div>
            <span class="fl w20"><em class="icon_Completed"></em>已完成</span>
          </div>
        </li>
        <li>
          <div class="posCatalog_select" onclick="javascript:void(0)" data-knowledgeid="6100113">
            <div class="num_tune"><a>1.2</a></div>
            <div class="posCatalog_name">1.2 基本概念</div>
            <span class="fl w20"><em class="icon_Completed"></em>已完成</span>
          </div>
        </li>
      </ul>
    </li>
    <!-- 第二章：当前章（active）且含视频，未完成 -->
    <li class="chapter firstLayer">
      <div class="posCatalog_select firstLayer">
        <div class="posCatalog_name">第二章 应用</div>
      </div>
      <ul>
        <li>
          <div class="posCatalog_select" onclick="javascript:void(0);/*chapterId=1217304706*/" data-knowledgeid="6100120">
            <div class="num_tune"><a>2.1</a></div>
            <div class="posCatalog_name">2.1 视频要点</div>
            <span class="fl"><i class="icon_Completed" style="display:none"></i>待完成</span>
            <div class="pos_btn"><a class="orangeNew" href="javascript:void(0)">播放</a></div>
          </div>
        </li>
        <li>
          <div class="posCatalog_select posCatalog_active" onclick="javascript:void(0);chapterId=1217304706&knowledgeid=6100112">
            <div class="num_tune"><a>2.2</a></div>
            <div class="posCatalog_name">2.2 案例</div>
            <span class="fl">待完成</span>
          </div>
        </li>
      </ul>
    </li>
    <!-- 第三章：无 chapterId 的纯文档节点 -->
    <li class="chapter firstLayer">
      <div class="posCatalog_select firstLayer">
        <div class="posCatalog_name">第三章 补充资料</div>
      </div>
      <ul>
        <li>
          <div class="posCatalog_select" data-knowledgeid="6100119">
            <div class="posCatalog_name">3.1 PDF 文档</div>
            <span class="fl">待完成</span>
          </div>
        </li>
      </ul>
    </li>
  </ul>
</div>
</body>
</html>
