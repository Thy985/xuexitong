name: run (MVP - learn one video task naturally)

# E5: 支持 Initialize / Run / Switch 三种操作模式
#
# 用法:
#   workflow_dispatch:
#     inputs:
#       action: initialize | run | switch  (默认 run)
#       course_url: ...
#       chapter_id: ... (run 模式可选)
#
# 失败诊断策略:
#   1. 主步骤 continue-on-error: true — 引擎失败不终止 job
#   2. 诊断步骤 if: always() — 无论成败都打印 failure_stage
#   3. 产物上传 if: always() — 截图/evidence 始终进 artifact
#   4. 最终判定步骤 if: always() — 读 result.exit_code 控制红绿

on:
  workflow_dispatch:
    inputs:
      action:
        description: "操作模式: initialize/run/switch"
        required: false
        default: "run"
        type: choice
        options:
          - initialize
          - run
          - switch
      course_url:
        description: "学习通课程/章节 studentstudy URL"
        required: true
      chapter_id:
        description: "(可选) 欲学习的章节 id，缺省取 URL 中的 chapterId"
        required: false
        default: ""
      max_chapters:
        description: "最多自动学习的视频任务点数量（MVP 建议 1）"
        required: false
        default: "1"
      max_attempts:
        description: "视频 iframe/metadata 瞬态失败的最大尝试次数（默认 2）"
        required: false
        default: "2"

jobs:
  learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CX_USER: ${{ secrets.CX_USER }}
      CX_PASS: ${{ secrets.CX_PASS }}
      COURSE_URL: ${{ github.event.inputs.course_url }}
      GHA_ACTION: ${{ github.event.inputs.action || 'run' }}
      GHA_CHAPTER: ${{ github.event.inputs.chapter_id }}
      GHA_MAX: ${{ github.event.inputs.max_chapters || '1' }}
      GHA_ATTEMPTS: ${{ github.event.inputs.max_attempts || '2' }}
      PLAYWRIGHT_JSBUNDLE: ""
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 确保能读取/写入 state/ 目录
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install system deps (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils fonts-noto-cjk
          pkill -f "Xvfb :99" || true
          echo "system-deps-installed"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.62.0
          playwright install chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('chromium_version:', p.chromium.launch().version); p.stop()"
          echo "python-deps-installed"

      # ── Initialize 模式: 仅解析 URL，不执行学习 ──────────────────
      - name: Initialize course
        if: github.event.inputs.action == 'initialize'
        run: |
          echo "=== Initialize Course ==="
          python app/run.py --action initialize \
            --course-url "$COURSE_URL" \
            --output ./evidence/result.json
          echo "initialize-complete"

      # ── Switch 模式: 解析并切换课程，不执行学习 ───────────────────
      - name: Switch course
        if: github.event.inputs.action == 'switch'
        run: |
          echo "=== Switch Course ==="
          python app/run.py --action switch \
            --course-url "$COURSE_URL" \
            --output ./evidence/result.json
          echo "switch-complete"

      # ── Run 模式: 执行视频学习 ────────────────────────────────────
      - name: Run MVP learn (headed + Xvfb)
        if: github.event.inputs.action == 'run' || github.event.inputs.action == ''
        continue-on-error: true
        run: |
          Xvfb :99 -screen 0 1440x900x24 -ac &
          export DISPLAY=:99
          sleep 2
          xdpyinfo -display :99 >/dev/null 2>&1 || echo "xdpyinfo failed"
          ARGS="--course-url \"$COURSE_URL\" --output ./evidence/result.json --xvfb-display :99 --max-attempts $GHA_ATTEMPTS"
          if [ -n "$GHA_CHAPTER" ]; then ARGS="$ARGS --chapter-id $GHA_CHAPTER"; fi
          ARGS="$ARGS --max-chapters $GHA_MAX"
          echo ">> python app/run.py $ARGS"
          eval "python app/run.py $ARGS"
          echo "mvp-run-complete"

      # ── 提交状态更新（run 模式成功后）────────────────────────────
      - name: Commit state update
        if: github.event.inputs.action == 'run' && success()
        run: |
          echo "=== Committing state updates ==="
          git config user.name "xuexitong-mvp"
          git config user.email "mvp@xuexitong.local"
          git add state/
          git diff --cached --quiet || git commit -m "chore(state): update course state after run"
          git push || echo "push skipped (may be read-only fork)"

      # ── 诊断步骤：always 执行 ─────────────────────────────────────
      - name: Dump failure diagnostics
        if: always()
        run: |
          echo "=== MVP diagnostics ==="
          python3 - <<'PY'
          import json, sys, glob, os
          files = glob.glob('./evidence/result*.json') + glob.glob('./evidence/run_*.json')
          if not files:
              print("## ⚠️ No result file produced — check action above")
              sys.exit(0)
          with open(files[0]) as f:
              r = json.load(f)
          res = r.get("result", {})
          ev = r.get("evidence", {})
          checks = ev.get("checks", {})
          diag = ev.get("diagnostics", {})
          action = res.get("action", "run")
          print(f"══════════ {action.upper()} DIAGNOSTICS ══════════")
          print(f"action:          {action}")
          print(f"verdict:         {res.get('verdict')}")
          print(f"failure_stage:   {res.get('failure_stage')}")
          print(f"passed_count:    {res.get('passed_count')}/10")
          print(f"retry_count:     {res.get('retry_count')}")
          print(f"timing_s:        {res.get('timing_s')}")
          print(f"crash:           {res.get('crash') or 'none'}")
          print(f"course_key:      {res.get('course_key') or 'N/A'}")
          print()
          # 关键 checks 状态
          failed_checks = [k for k, v in checks.items()
                          if isinstance(v, bool) and not v]
          if failed_checks:
              print("── failed checks ──")
              for k in failed_checks:
                  print(f"  ✗ {k}")
              print()
          # 诊断上下文
          print("── diagnostics ──")
          if diag:
              for dk, dv in diag.items():
                  if isinstance(dv, (dict, list)):
                      s = json.dumps(dv, ensure_ascii=False)[:200]
                  else:
                      s = str(dv)[:200]
                  print(f"  {dk}: {s}")
          else:
              print("  (no diagnostics captured)")
          for ek in ("key_console", "errors"):
              vals = ev.get(ek)
              if vals:
                  print(f"  {ek}: {[str(x)[:120] for x in vals[-5:]]}")
          # 课程状态
          cs = r.get("course_state")
          if cs:
              print("── course_state ──")
              print(f"  status: {cs.get('status')}")
              print(f"  run_count: {cs.get('run_count')}")
              print(f"  success_count: {cs.get('success_count')}")
              print(f"  last_run: {cs.get('last_run')}")
              print(f"  progress: {cs.get('progress')}")
          print("══════════════════════════════════════")
          PY
          echo ""
          echo "Evidence artifacts:"
          ls -la evidence/ 2>/dev/null || echo "  no evidence dir"
          ls -la /tmp/diag_*.png 2>/dev/null || echo "  no diag screenshots"
          echo ""
          echo "State directory:"
          ls -la state/ 2>/dev/null || echo "  no state dir"
          ls -la state/courses/ 2>/dev/null || echo "  no courses dir"

      # ── 产物上传：always 执行 ─────────────────────────────────────
      - name: Upload Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-evidence-${{ github.run_id }}
          path: |
            evidence/
            state/
            app/
            resolvers/
            /tmp/diag_*.png
          retention-days: 30

      # ── 最终判定：用 exit_code 控制红绿 ───────────────────────────
      - name: Final verdict
        if: always()
        run: |
          CODE=$(python3 - <<'PY'
          import json, glob, sys
          files = glob.glob('./evidence/result*.json') + glob.glob('./evidence/run_*.json')
          if not files:
              print("1", end="")
              sys.exit(0)
          try:
              r = json.load(open(files[0]))
              # initialize/switch 模式总是成功（除非解析失败）
              action = r.get("result", {}).get("action", "run")
              if action in ("initialize", "switch"):
                  print("0", end="")
              else:
                  print(r["result"].get("exit_code", 1), end="")
          except Exception:
              print("1", end="")
          PY
          )
          echo "Result exit_code=$CODE"
          exit "$CODE"
