name: run (MVP - learn one video task naturally)

# 产品级 MVP 触发：Fork → 设置 CX_USER/CX_PASS Secrets → 填 course_url → Run。
# 复用 E-series 已验证的有头浏览器(Chromium+Xvfb)自然播放引擎；
# 不构造/不伪造/不重放 multimedia/log，不改业务参数；仅自然学习
# URL 中指定的一个视频任务点并返回 Evidence。

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: "学习通课程/章节 studentstudy URL（含 courseId/clazzid/cpi/enc/chapterId）"
        required: true
      chapter_id:
        description: "(可选) 欲学习的章节 id，缺省取 URL 中的 chapterId"
        required: false
        default: ""
      max_chapters:
        description: "最多自动学习的视频任务点数量（MVP 建议 1）"
        required: false
        default: "1"

jobs:
  learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CX_USER: ${{ secrets.CX_USER }}
      CX_PASS: ${{ secrets.CX_PASS }}
      COURSE_URL: ${{ github.event.inputs.course_url }}
      GHA_CHAPTER: ${{ github.event.inputs.chapter_id }}
      GHA_MAX: ${{ github.event.inputs.max_chapters || '1' }}
      PLAYWRIGHT_JSBUNDLE: ""
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install system deps (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils fonts-noto-cjk
          pkill -f "Xvfb :99" || true
          echo "system-deps-installed"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.62.0
          playwright install chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('chromium_version:', p.chromium.launch().version); p.stop()"
          echo "python-deps-installed"

      - name: Run MVP learn (headed + Xvfb)
        run: |
          Xvfb :99 -screen 0 1440x900x24 -ac &
          export DISPLAY=:99
          sleep 2
          xdpyinfo -display :99 >/dev/null 2>&1 || echo "xdpyinfo failed"
          ARGS="--course-url \"$COURSE_URL\" --output ./evidence/run_<ts>.json --xvfb-display :99"
          if [ -n "$GHA_CHAPTER" ]; then ARGS="$ARGS --chapter-id $GHA_CHAPTER"; fi
          ARGS="$ARGS --max-chapters $GHA_MAX"
          echo ">> python app/run.py $ARGS"
          eval "python app/run.py $ARGS"
          echo "mvp-run-complete"

      - name: Upload Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-evidence-${{ github.run_id }}
          path: |
            evidence/
            app/
          retention-days: 30

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "=== MVP diagnostics ==="
          cat /etc/os-release | head -5 ; nproc ; free -h | head -3
          echo "DISPLAY=$DISPLAY" ; pgrep -a Xvfb || echo "no Xvfb"
          ls evidence/ 2>/dev/null || echo "no evidence dir"
          grep -ri "traceback\|error\|exception" evidence/ 2>/dev/null | head -20 || true